<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: draw under the notch/home bar; safe areas are padded in CSS -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#08080a" />
    <meta name="referrer" content="no-referrer" />
    <!-- Installable app: opens full-screen from the home screen, without browser bars -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Arai" />
    <!-- Solid black status bar: iOS reserves that strip, so nothing ever scrolls (blurred) under the clock. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="application-name" content="Arai" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
    <title>Arai</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Arai needs JavaScript: your encryption keys are created and used only in your browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
