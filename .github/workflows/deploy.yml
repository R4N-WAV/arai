# Deploys Arai (SPA + API) to Cloudflare Workers on every push to main.
#
# One-time setup (see README "Deployment"):
#   Repository secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   Repository variable:  D1_DATABASE_ID   (id of the D1 database named "arai")
# Until D1_DATABASE_ID is set this workflow is skipped.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.D1_DATABASE_ID != '' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build web app
        run: npm run build -w @arai/web

      - name: Point wrangler at the production D1 database
        working-directory: apps/api
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: |
          [[ "$D1_DATABASE_ID" =~ ^[0-9a-f-]{36}$ ]] || { echo "D1_DATABASE_ID is not a valid id"; exit 1; }
          sed -i "s/00000000-0000-0000-0000-000000000000/$D1_DATABASE_ID/" wrangler.jsonc

      - name: Apply database migrations
        working-directory: apps/api
        run: npx wrangler d1 migrations apply arai --remote

      - name: Deploy Worker
        working-directory: apps/api
        run: npx wrangler deploy

      # Server secrets are generated inside this job the first time only and
      # stored solely in Cloudflare (never in GitHub or the repo). Existing
      # secrets are never overwritten: changing AUTH_PEPPER would invalidate
      # every password. If listing fails, the job fails instead of guessing.
      - name: Create missing server secrets
        working-directory: apps/api
        run: |
          set -euo pipefail
          existing="$(npx wrangler secret list --format json)"
          for name in AUTH_PEPPER KDF_SALT_SECRET IP_HMAC_SECRET; do
            if grep -q "\"$name\"" <<<"$existing"; then
              echo "$name already set"
            else
              openssl rand -hex 32 | npx wrangler secret put "$name"
              echo "$name created"
            fi
          done
