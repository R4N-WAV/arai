# Deploys Arai (SPA + API) to Cloudflare Workers on every push to main.
#
# One-time setup (see README "Deployment"):
#   Repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Until CLOUDFLARE_API_TOKEN is set, the deploy steps are skipped.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check Cloudflare credentials are configured
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets not set - skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install
        if: steps.gate.outputs.ready == 'true'
        run: npm ci
      - name: Typecheck
        if: steps.gate.outputs.ready == 'true'
        run: npm run typecheck
      - name: Test
        if: steps.gate.outputs.ready == 'true'
        run: npm test
      - name: Build web app
        if: steps.gate.outputs.ready == 'true'
        run: npm run build -w @arai/web

      - name: Apply database migrations
        if: steps.gate.outputs.ready == 'true'
        working-directory: apps/api
        run: npx wrangler d1 migrations apply arai --remote

      - name: Deploy Worker
        if: steps.gate.outputs.ready == 'true'
        working-directory: apps/api
        run: npx wrangler deploy

      # Server secrets are generated inside this job the first time only and
      # stored solely in Cloudflare (never in GitHub or the repo). Existing
      # secrets are never overwritten: changing AUTH_PEPPER would invalidate
      # every password. If listing fails, the job fails instead of guessing.
      - name: Create missing server secrets
        if: steps.gate.outputs.ready == 'true'
        working-directory: apps/api
        run: |
          set -euo pipefail
          existing="$(npx wrangler secret list --format json)"
          for name in AUTH_PEPPER KDF_SALT_SECRET IP_HMAC_SECRET; do
            if grep -q "\"$name\"" <<<"$existing"; then
              echo "$name already set"
            else
              openssl rand -hex 32 | npx wrangler secret put "$name"
              echo "$name created"
            fi
          done
